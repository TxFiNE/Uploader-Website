<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 Vazirmatn,Tahoma,sans-serif}
a{color:inherit;text-decoration:none}header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--l);padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font-weight:900;font-size:19px}.logo b{color:var(--ac)}header form{flex:1;min-width:140px}
nav{display:flex;gap:6px;flex-wrap:wrap}main{max-width:1000px;margin:0 auto;padding:16px;min-height:75vh}
input,textarea,select{width:100%;font:inherit;color:var(--fg);background:var(--s2);border:1px solid var(--l);border-radius:10px;padding:8px 12px;margin:4px 0}
select option{background:var(--s2)}textarea{resize:vertical;min-height:70px}
button,.b{font:inherit;cursor:pointer;background:var(--ac);color:#1a0a00;font-weight:700;border:0;border-radius:10px;padding:7px 16px;display:inline-block}
button:disabled{opacity:.5;cursor:default}
.g{background:transparent;color:var(--fg);border:1px solid var(--l)}.g.on{border-color:var(--r);color:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.grid.s{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.card{background:var(--s);border-radius:12px;overflow:hidden;border:1px solid var(--l);position:relative}.card video{width:100%;aspect-ratio:16/9;background:#000;display:block;object-fit:cover}.grid.s .card video{aspect-ratio:9/16}.card div{padding:8px 12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--s2);object-fit:cover;display:inline-grid;place-items:center;font-weight:700;vertical-align:middle}.av.big{width:84px;height:84px;font-size:30px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--l);flex-wrap:wrap}.mu{color:var(--mu);font-size:13px}.box{max-width:460px;margin:20px auto}

.card .bd{position:absolute;top:6px;right:6px;background:#000a;color:#fff;padding:0 6px}
.bar{height:8px;background:var(--s2);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.rd{display:flex;gap:8px;margin:6px 0}.rd label{flex:1;border:1px solid var(--l);border-radius:10px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}.rd input{width:auto;margin:0}
.burger{padding:7px 10px;line-height:0}.burger svg{width:22px;height:22px}
#ov{position:fixed;inset:0;background:#000a;z-index:9;opacity:0;pointer-events:none;transition:opacity .25s}
#dr{position:fixed;top:0;bottom:0;left:0;width:270px;max-width:82vw;background:var(--s);border-right:1px solid var(--l);z-index:10;transform:translateX(-102%);transition:transform .25s;padding:16px;display:flex;flex-direction:column;gap:4px;overflow:auto}
body.open #dr{transform:none}body.open #ov{opacity:1;pointer-events:auto}
#dr a,#dr button{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;text-align:right;background:none;color:var(--fg);font-weight:400;width:100%}
#dr a:hover,#dr button:hover{background:var(--s2)}#dr a.cur{background:var(--s2);color:var(--ac);font-weight:700}#dr hr{border:0;border-top:1px solid var(--l);margin:8px 0;width:100%}
footer{text-align:center;padding:20px;color:var(--mu);font-size:13px}footer a{text-decoration:underline}
.pol h3{margin-bottom:2px;color:var(--ac)}.pol p,.pol li{color:#d8d0c6}
/* ---- motion logo ---- */
.lgw{text-align:center}.lgw svg{width:110px;height:auto;overflow:visible}
.lg{display:inline-block;text-align:center}.lg svg{animation:lgglow 2.4s ease-in-out 1.6s infinite}
.lb{transform-origin:246px 354px;animation:lbin .7s cubic-bezier(.2,1.4,.4,1) both}
.lc{transform-origin:15px 205px;animation:lcs 1.1s cubic-bezier(.3,.9,.3,1) .4s both}
.lp{transform-origin:236px 368px;animation:lpp .6s cubic-bezier(.2,1.6,.4,1) 1.05s both}
.lsh{animation:lsw 1s ease-in-out 1.55s both}
.lt{font-weight:900;font-size:30px;letter-spacing:.5px;animation:ltin .8s ease 1.3s both}.lt b{color:var(--ac)}
@keyframes lbin{from{opacity:0;transform:translateY(40px) scale(.6)}to{opacity:1;transform:none}}
@keyframes lcs{0%{opacity:0;transform:rotate(-46deg) translateY(-24px)}30%{opacity:1;transform:rotate(-36deg)}68%{transform:rotate(4deg)}82%{transform:rotate(-2.5deg)}100%{opacity:1;transform:none}}
@keyframes lpp{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:none}}
@keyframes lsw{from{transform:translateX(-260px)}to{transform:translateX(620px)}}
@keyframes ltin{from{opacity:0;transform:translateY(14px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes lgglow{0%,100%{filter:drop-shadow(0 0 6px #ff6a1344)}50%{filter:drop-shadow(0 0 26px #ff6a13aa)}}
#splash{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 45%,#1d1209,#0a0908 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:opacity .5s,transform .5s}
#splash svg{width:170px}#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
#splash .sk{position:absolute;bottom:22px;color:var(--mu);font-size:12px}
@media(prefers-reduced-motion:reduce){.lb,.lc,.lp,.lsh,.lt,.lg svg{animation:none!important}}

const SQL=`-- SQL اولیه (فقط برای پروژه‌ی جدید)
create table profiles(
 id uuid primary key references auth.users on delete cascade,
 username text unique not null check (username ~ '^[a-z0-9_]{3,20}$'),
 name text default '', avatar_url text default '',
 role text not null default 'user' check (role in ('user','admin','owner')),
 banned bool not null default false, no_upload bool not null default false, no_chat bool not null default false,
 created_at timestamptz default now());
create table videos(id uuid primary key default gen_random_uuid(), owner uuid not null references profiles on delete cascade,
 title text not null, url text not null, path text not null, created_at timestamptz default now());
create table messages(id bigint generated always as identity primary key, sender uuid not null references profiles on delete cascade,
 receiver uuid not null references profiles on delete cascade, body text not null check(length(body)<=2000), created_at timestamptz default now());

create function is_owner() returns bool language sql security definer stable set search_path=public as $$
 select exists(select 1 from profiles where id=auth.uid() and role='owner') $$;
create function is_staff() returns bool language sql security definer stable set search_path=public as $$
 select exists(select 1 from profiles where id=auth.uid() and role in('admin','owner')) $$;
create function can_do(what text) returns bool language sql security definer stable set search_path=public as $$
 select exists(select 1 from profiles where id=auth.uid() and not banned and (case what when 'upload' then not no_upload when 'chat' then not no_chat else true end)) $$;

create function handle_new_user() returns trigger language plpgsql security definer set search_path=public as $$
declare u text; begin
 u:=lower(regexp_replace(coalesce(new.raw_user_meta_data->>'username',split_part(new.email,'@',1)),'[^a-z0-9_]','','g'));
 if length(u)<3 then u:='user'||substr(md5(random()::text),1,6); end if;
 u:=left(u,20);
 while exists(select 1 from profiles where username=u) loop u:=left(u,13)||substr(md5(random()::text),1,6); end loop;
 insert into profiles(id,username,name,avatar_url) values(new.id,u,coalesce(new.raw_user_meta_data->>'full_name',''),coalesce(new.raw_user_meta_data->>'avatar_url',''));
 return new; end $$;
create trigger on_signup after insert on auth.users for each row execute function handle_new_user();

create function guard_profile() returns trigger language plpgsql security definer set search_path=public as $$
begin if auth.uid() is not null and not is_owner() then
 new.role:=old.role; new.banned:=old.banned; new.no_upload:=old.no_upload; new.no_chat:=old.no_chat; end if; return new; end $$;
create trigger guard before update on profiles for each row execute function guard_profile();

alter table profiles enable row level security; alter table videos enable row level security; alter table messages enable row level security;
create policy p_sel on profiles for select using(true);
create policy p_upd on profiles for update using(id=auth.uid() or is_owner());
create policy v_sel on videos for select using(true);
create policy v_ins on videos for insert with check(owner=auth.uid() and can_do('upload'));
create policy v_del on videos for delete using(owner=auth.uid() or is_staff());
create policy m_sel on messages for select using(sender=auth.uid() or receiver=auth.uid());
create policy m_ins on messages for insert with check(sender=auth.uid() and can_do('chat'));

insert into storage.buckets(id,name,public,file_size_limit) values('videos','videos',true,52428800),('avatars','avatars',true,5242880) on conflict do nothing;
create policy s_read on storage.objects for select using(bucket_id in('videos','avatars'));
create policy s_ins on storage.objects for insert to authenticated with check(bucket_id in('videos','avatars') and (storage.foldername(name))[1]=auth.uid()::text and (bucket_id='avatars' or can_do('upload')));
create policy s_upd on storage.objects for update to authenticated using(bucket_id='avatars' and (storage.foldername(name))[1]=auth.uid()::text);
create policy s_del on storage.objects for delete to authenticated using((storage.foldername(name))[1]=auth.uid()::text or is_staff());

-- AFTER the owner has signed up once, run this to make that account the owner:
-- update profiles set role='owner' where id=(select id from auth.users where email='Parsaxgamer65@gmail.com');
`;

<clipPath id="c${k}"><path d="M50 226L452 200Q483 198 483 235V440Q483 508 415 508H80Q10 508 10 440V250Q10 226 50 226Z"/><path d="M50 115L400 18Q440 10 452 50L470 117L15 205L10 170Q10 125 50 115Z"/></clipPath></defs>

async function watch(id){const{data:v}=await sb.from('videos').select('*,profiles(*)').eq('id',id).single();if(!v)return M().innerHTML='پیدا نشد';

function meta(file){return new Promise((res,rej)=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{res({d:v.duration,h:v.videoHeight});URL.revokeObjectURL(v.src)};v.onerror=()=>rej(new Error('فایل ویدیویی معتبر نیست'));v.src=URL.createObjectURL(file)})}
async function transcode(file,h,onp){
 if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw new Error('مرورگر پشتیبانی نمی‌کند');
 const v=document.createElement('video');v.src=URL.createObjectURL(file);v.playsInline=true;v.muted=true;
 await new Promise((r,j)=>{v.onloadedmetadata=r;v.onerror=()=>j(new Error('خطا در خواندن ویدیو'))});
 if(v.videoHeight<=h){URL.revokeObjectURL(v.src);return[file,false]}
 const w=Math.round(v.videoWidth*h/v.videoHeight/2)*2,c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');
 const out=c.captureStream(30);let ac;
 try{ac=new(window.AudioContext||window.webkitAudioContext)();const src=ac.createMediaElementSource(v),dst=ac.createMediaStreamDestination();src.connect(dst);dst.stream.getAudioTracks().forEach(t=>out.addTrack(t))}catch(e){}
 const mt=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));if(!mt)throw new Error('کدک پشتیبانی نمی‌شود');
 const br={1080:5e6,720:2.5e6,480:1.2e6,360:7e5}[h]||2e6,rec=new MediaRecorder(out,{mimeType:mt,videoBitsPerSecond:br}),parts=[];
 rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
 await new Promise((res,rej)=>{rec.onstop=res;rec.onerror=()=>rej(new Error('خطا در فشرده‌سازی'));v.onended=()=>rec.stop();
  const draw=()=>{if(v.ended||v.paused&&v.currentTime>0&&rec.state==='inactive')return;ctx.drawImage(v,0,0,w,h);onp&&onp(Math.min(99,Math.round(v.currentTime/v.duration*100)));requestAnimationFrame(draw)};
  rec.start(1000);v.muted=false;if(ac&&ac.state==='suspended')ac.resume();v.play().then(draw).catch(rej)});
 if(ac)ac.close();URL.revokeObjectURL(v.src);
 return[new File(parts,'v',{type:mt.split(';')[0]}),true]}

function privacy(){M().innerHTML=`<div class="pol" style="max-width:760px;margin:auto"><h2>حریم خصوصی و قوانین استفاده</h2><p class="mu">آخرین به‌روزرسانی: ۱۴۰۵ — این متن توضیح می‌دهد «جعبه ویدیو» با اطلاعات شما چه می‌کند.</p>
<h3>۱. چه اطلاعاتی جمع می‌کنیم</h3><ul><li>ایمیل و رمز عبور (رمز به‌صورت هش‌شده نگهداری می‌شود و برای ما قابل مشاهده نیست).</li><li>آیدی، نام و عکس پروفایل (شماره تلفن از کاربران گرفته نمی‌شود).</li><li>ویدیوهایی که آپلود می‌کنی، عنوان و توضیحات، لایک‌ها و تعداد بازدید.</li><li>پیام‌هایی که در چت می‌فرستی.</li><li>اگر با گوگل وارد شوی، نام، ایمیل و عکس حساب گوگلت دریافت می‌شود.</li></ul>
<h3>۲. چه چیزی عمومی است</h3><p>آیدی، نام، عکس پروفایل و ویدیوهای آپلودشده برای همه قابل مشاهده است. ایمیل شما نمایش عمومی ندارد. پیام‌ها فقط برای فرستنده و گیرنده نمایش داده می‌شوند.</p>
<h3>۳. نحوه استفاده</h3><p>اطلاعات فقط برای اجرای سرویس (ورود، نمایش پروفایل و ویدیو، چت، مدیریت تخلفات و امنیت) استفاده می‌شود. اطلاعات شما فروخته نمی‌شود و برای تبلیغات به شخص ثالث داده نمی‌شود.</p>
<h3>۴. نگهداری و سرویس‌های ثالث</h3><p>داده‌ها روی سرویس Supabase ذخیره می‌شوند و فایل‌های فونت از Google Fonts بارگذاری می‌شود. مرورگر شما برای ماندن در حساب، نشست ورود را در حافظه محلی (localStorage) ذخیره می‌کند. به‌دلیل ماهیت فنی سرویس، مدیر سایت از نظر فنی به پایگاه داده دسترسی دارد؛ ما آن را جز برای رفع مشکل یا بررسی گزارش تخلف نمی‌خوانیم.</p>
<h3>۵. قوانین محتوا</h3><ul><li>آپلود محتوای غیرقانونی، خشونت شدید، محتوای جنسی، آزار و تهدید، نقض حق کپی‌رایت و محتوایی که کودکان را در خطر قرار دهد ممنوع است.</li><li>اسپم، جعل هویت و آزار کاربران ممنوع است.</li><li>فقط ویدیویی را آپلود کن که حق انتشارش را داری.</li><li>مدیران می‌توانند ویدیوهای متخلف را حذف و حساب‌ها را محدود یا مسدود کنند.</li></ul>
<h3>۶. حجم و کیفیت</h3><p>حداکثر حجم هر ویدیو ${mb(MAX)} مگابایت است. ویدیوی شورت حداکثر ${SHORT_MAX} ثانیه است. فشرده‌سازی کیفیت در مرورگر خودت انجام می‌شود و ممکن است کیفیت نهایی با فایل اصلی تفاوت داشته باشد.</p>
<h3>۷. حقوق شما</h3><p>می‌توانی هر زمان اطلاعات پروفایل، ایمیل و رمز را از بخش «حساب کاربری» تغییر دهی و ویدیوهایت را حذف کنی. برای حذف کامل حساب و داده‌ها یا هر پرسش درباره حریم خصوصی به ایمیل <a dir="ltr" href="mailto:${CONTACT}" style="text-decoration:underline">${CONTACT}</a> پیام بده.</p>
<h3>۸. سن کاربران</h3><p>استفاده از سایت برای کودکان زیر ۱۳ سال بدون اجازه والدین توصیه نمی‌شود.</p>
<h3>۹. تغییرات</h3><p>ممکن است این متن به‌روزرسانی شود؛ ادامه استفاده از سایت به‌معنی پذیرش نسخه جدید است.</p></div>`}

function setup(){const blk=(i,t)=>`<button data-c="${i}">کپی</button><pre id="${i}" dir="ltr" style="user-select:text;background:var(--s);border:1px solid var(--l);border-radius:10px;padding:12px;overflow:auto;max-height:40vh;font-size:12px;white-space:pre-wrap">${esc(t)}</pre>`;
 M().innerHTML=`<div class="box" style="max-width:760px"><h2>راه‌اندازی</h2>${OK?'':'<p class="err">کلیدهای Supabase هنوز داخل فایل وارد نشده‌اند.</p>'}
 <ol><li>در supabase.com یک پروژه بساز و SUPABASE_URL و SUPABASE_KEY را در ابتدای script بگذار.</li><li>پروژه‌ی جدید: ابتدا SQL اولیه و بعد SQL آپگرید را اجرا کن. پروژه‌ی قبلی: فقط SQL آپگرید.</li><li>در Authentication ← URL Configuration آدرس سایت را در Site URL و Redirect URLs بگذار.</li><li>بعد از اولین ثبت‌نام خودت، خط آخر SQL اولیه را با ایمیل خودت اجرا کن.</li></ol>
 <h3>SQL آپگرید</h3>${blk('s1',SQL_UP)}<h3>SQL اولیه</h3>${blk('s2',SQL)}</div>`;
 M().onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;const t=$('#'+b.dataset.c).textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>b.textContent='کپی شد ✓').catch(()=>{const r=document.createRange();r.selectNodeContents($('#'+b.dataset.c));getSelection().removeAllRanges();getSelection().addRange(r);b.textContent='Ctrl+C بزن'})}}
function auth(){let mode='in';M().innerHTML=`<div class="box" style="margin-bottom:0"><div class="lgw"><div class="lg">${logo('a')}<div class="lt" style="font-size:24px">جعبه <b>ویدیو</b></div></div></div></div><div id="af"></div>`;const draw=()=>{$('#af').innerHTML=`<div class="box"><div class="row"><button class="${mode==='in'?'':'g'}" id="a1">ورود</button><button class="${mode==='up'?'':'g'}" id="a2">ثبت‌نام</button></div>
 <input id="em" type="email" dir="ltr" placeholder="ایمیل">${mode==='up'?'<input id="un" dir="ltr" placeholder="آیدی دلخواه (انگلیسی)">':''}<input id="pw" type="password" dir="ltr" placeholder="رمز عبور">${mode==='up'?'<input id="p2" type="password" dir="ltr" placeholder="تکرار رمز عبور"><p class="mu">با ساخت حساب، <a href="#/privacy" style="text-decoration:underline">قوانین و حریم خصوصی</a> را می‌پذیری.</p>':''}
 <button id="go" style="width:100%;margin-top:8px">${mode==='in'?'ورود':'ساخت حساب'}</button><button class="g" id="gg" style="width:100%;margin-top:8px">ورود با حساب گوگل</button><p id="st" class="err"></p></div>`;
 $('#a1').onclick=()=>{mode='in';draw()};$('#a2').onclick=()=>{mode='up';draw()};
 $('#gg').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
 $('#go').onclick=async()=>{const st=$('#st'),email=$('#em').value.trim(),pw=$('#pw').value;let r;
  if(mode==='up'){const un=$('#un').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(un))return st.textContent='آیدی نامعتبر است (۳ تا ۲۰ حرف انگلیسی/عدد/_)';
   if(pw.length<6)return st.textContent='رمز حداقل ۶ کاراکتر باشد';if(pw!==$('#p2').value)return st.textContent='رمز و تکرارش یکی نیست';
   const{data:ex}=await sb.from('profiles').select('id').eq('username',un).maybeSingle();if(ex)return st.textContent='این آیدی گرفته شده';
   r=await sb.auth.signUp({email,password:pw,options:{data:{username:un}}});if(!r.error&&!r.data.session)return st.textContent='ایمیل تأیید برایت فرستاده شد؛ بعد از تأیید وارد شو.'}
  else r=await sb.auth.signInWithPassword({email,password:pw});
  if(r.error)return st.textContent=r.error.message;await loadMe();location.hash='#/'}};draw()}
(()=>{let seen=0;try{seen=sessionStorage.getItem('sp')}catch(e){}if(seen)return;try{sessionStorage.setItem('sp','1')}catch(e){}
 const s=document.createElement('div');s.id='splash';s.innerHTML=`<div class="lg">${logo('s')}<div class="lt">جعبه <b>ویدیو</b></div></div><div class="sk">برای رد شدن بزن</div>`;document.body.appendChild(s);
 const close=()=>{s.classList.add('out');setTimeout(()=>s.remove(),600)};s.onclick=close;setTimeout(close,3400)})();
window.addEventListener('hashchange',route);
if(OK){sb.auth.onAuthStateChange(()=>loadMe());loadMe().then(route)}else route();
</script></body></html>
